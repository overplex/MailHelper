version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - intrange
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        # LazyProc.Call always returns GetLastError as its error, whether the
        # call failed or not; callers inspect the return value instead.
        - (*syscall.LazyProc).Call
    revive:
      rules:
        # winapi mirrors Win32 names such as WS_CHILD and WM_COMMAND on purpose,
        # and its one-line wrappers need no doc comment of their own.
        - name: var-naming
          disabled: true
        - name: exported
          disabled: true
        - name: package-comments
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: unreachable-code
        - name: unused-parameter
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Scripted fake servers in tests write to in-memory pipes; a failed write
      # surfaces as a failed assertion on the client side instead.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - mailhelper
